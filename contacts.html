<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Кофейня «Апрель» — контакты</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="logo">☕ Апрель</div>
    <nav class="nav">
      <a href="index.html">Главная</a>
      <a href="about.html">О нас</a>
      <a href="contacts.html">Контакты</a>
    </nav>
  </header>

  <section class="hero small">
    <h1>Контакты</h1>
  </section>

  <section class="section">
    <div class="block">
      <p>📍 ул. Липовая, 12</p>
      <p>🕐 Ежедневно с 8:00 до 22:00</p>
      <p>📞 +7 (900) 123-45-67</p>
    </div>
    <div class="block">
      <h2>Напишите нам</h2>
      <form id="form">
        <input type="text" id="name" placeholder="Ваше имя" required>
        <input type="email" id="email" placeholder="Ваш e-mail" required>
        <textarea id="message" rows="4" placeholder="Ваше сообщение" required></textarea>
        <button type="submit" class="btn">Отправить</button>
      </form>
      <p id="result"></p>
    </div>
  </section>

  <footer class="footer">© 2026 Кофейня «Апрель»</footer>
  <script src="script.js"></script>
</body>
</html>
