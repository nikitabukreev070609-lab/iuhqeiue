<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Кофейня «Апрель» — контакты</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header" id="header">
    <a class="logo" href="index.html">☕ Апрель</a>
    <nav class="nav">
      <a href="index.html">Главная</a>
      <a href="about.html">О нас</a>
      <a href="contacts.html" class="active">Контакты</a>
    </nav>
  </header>

  <section class="hero hero-small">
    <p class="hero-eyebrow">Будем рады видеть вас</p>
    <h1>Контакты</h1>
    <p class="hero-text">Загляните сами или напишите нам</p>
  </section>

  <section class="section">
    <div class="contact-grid">
      <div class="contact-item reveal">
        <div class="icon">📍</div>
        <h3>Адрес</h3>
        <p>ул. Липовая, 12</p>
      </div>
      <div class="contact-item reveal">
        <div class="icon">🕐</div>
        <h3>Часы работы</h3>
        <p>Ежедневно с 8:00 до 22:00</p>
      </div>
      <div class="contact-item reveal">
        <div class="icon">📞</div>
        <h3>Телефон</h3>
        <p><a href="tel:+79001234567">+7 (900) 123-45-67</a></p>
      </div>
    </div>

    <div class="block reveal">
      <h2 class="section-title left">Напишите нам</h2>
      <form id="form" novalidate>
        <label for="name">Ваше имя</label>
        <input type="text" id="name" name="name" placeholder="Например, Анна" required>
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@example.com" required>
        <label for="message">Сообщение</label>
        <textarea id="message" name="message" rows="5" placeholder="Расскажите, чем мы можем помочь" required></textarea>
        <button type="submit" class="btn">Отправить</button>
        <p id="result" class="form-result" role="status"></p>
      </form>
    </div>
  </section>

  <footer class="footer">
    <p class="footer-logo">☕ Апрель</p>
    <p>© 2026 Кофейня «Апрель»</p>
    <p class="footer-note">Варим с любовью с 2015 года</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
